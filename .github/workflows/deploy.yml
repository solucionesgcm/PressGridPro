name: Deploy PressGrid Pro to WordPress

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Theme via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git*' --exclude='README.md' --exclude='.github/' --exclude='pressgrid-core/'
          path: ./
          remote_path: ~/domains/gcmnoticias.com/public_html/wp-content/themes/PressGridPro/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: 65002

      - name: Deploy PressGrid Core plugin
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude='.git*'
          path: ./pressgrid-core/
          remote_path: ~/domains/gcmnoticias.com/public_html/wp-content/plugins/pressgrid-core/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: 65002
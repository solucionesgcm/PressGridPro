name: Deploy PressGrid Pro to WordPress

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy Theme via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER: 82.25.83.190 }}
          username: ${{ secrets.FTP_USERNAME: u528738533.gcmnoticias.com }}
          password: ${{ secrets.FTP_PASSWORD: hs:iUP4k2!N3pzA }}
          # Ruta absoluta o relativa a la carpeta de tu tema en el servidor WordPress:
          server-dir: /public_html/wp-content/themes/PressGridPro/
          # Ignorar archivos del repositorio que no deben ir al servidor:
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/LICENSE
